<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 64" preserveAspectRatio="xMinYMid slice"><style>.band{animation:drift 7s cubic-bezier(.45,.05,.35,.95) infinite}@keyframes drift{to{transform:translateX(520px)}}.heat{animation:heat 3.2s ease-in-out infinite}@keyframes heat{50%{opacity:.6}}.mote{animation:rise 4s ease-out infinite}@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-30px);opacity:0}}</style><defs>
    <linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#7C2D12" stop-opacity=".46"/><stop offset=".55" stop-color="#7C2D12" stop-opacity=".12"/><stop offset="1" stop-color="#7C2D12" stop-opacity=".34"/></linearGradient>
    <linearGradient id="e" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FDBA74"/><stop offset="1" stop-color="#9A3412"/></linearGradient>
    <linearGradient id="band" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".09"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/><stop offset=".7" stop-color="#FFFFFF" stop-opacity=".04"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/></linearGradient></defs>
    <rect width="400" height="64" fill="#0B0C10" fill-opacity=".35"/>
    <rect width="400" height="64" fill="url(#b)"/>
    <g class="band"><rect x="-120" width="120" height="64" fill="url(#band)"/></g>
    <radialGradient id="hg" cx="1" cy="1" r=".9"><stop offset="0" stop-color="#F97316" stop-opacity=".42"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/></radialGradient><rect class="heat" x="250" width="150" height="64" fill="url(#hg)"/><path d="M330 51h56" stroke="#FDBA74" stroke-opacity=".45" stroke-width="1" stroke-linecap="round"/><circle class="mote" cx="358" cy="48" r="1.3" fill="#FED7AA"/>
    <rect width="400" height="1" fill="url(#top)"/>
    <rect width="3" height="64" fill="url(#e)"/></svg>
